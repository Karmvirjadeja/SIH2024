<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      #map {
        height: 600px;
      }
      button {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h3>Map Visualization of JSON Coordinates</h3>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      // Initialize the map and set the initial view
      var map = L.map("map").setView([13.0827, 80.2707], 4); // Default to Chennai view

      // Add tile layer
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      // Function to fetch the list of JSON files from the server
      async function fetchJsonFiles() {
        try {
          const response = await fetch("http://localhost:3000/get-json-files");
          if (!response.ok) {
            throw new Error("Failed to fetch JSON files");
          }
          return await response.json();
        } catch (error) {
          console.error(error);
          return [];
        }
      }

      // Function to fetch and display markers from each JSON file
      async function loadMarkers() {
        const jsonFiles = await fetchJsonFiles();

        if (jsonFiles.length === 0) {
          console.log("No JSON files found.");
          return;
        }

        let latlngs = [];

        for (const file of jsonFiles) {
          try {
            const response = await fetch(
              `http://localhost:3000/chennai-perth/${file}`
            );
            if (response.ok) {
              const data = await response.json();

              // Log the data to inspect its structure
              console.log(`Data from ${file}:`, data);

              data.forEach((point) => {
                if (point.Latitude && point.Longitude) {
                  const marker = L.marker([point.Latitude, point.Longitude])
                    .addTo(map)
                    .bindPopup(
                      `Lat: ${point.Latitude}, Lon: ${point.Longitude}`
                    );

                  // Track marker locations for map bounds adjustment
                  latlngs.push([point.Latitude, point.Longitude]);
                }
              });
            } else {
              console.error(`Failed to load ${file}: ${response.statusText}`);
            }
          } catch (error) {
            console.error(`Error loading ${file}:`, error);
          }
        }

        // Adjust map bounds to fit all markers
        if (latlngs.length > 0) {
          var bounds = L.latLngBounds(latlngs);
          map.fitBounds(bounds);
        }
      }

      // Call the function to load markers
      loadMarkers();
    </script>
  </body>
</html>
